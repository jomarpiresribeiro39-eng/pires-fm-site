<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar APK - Pires FM</title>
    <meta name="theme-color" content="#e63946">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #050510 0%, #1a0a0a 50%, #050510 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .icon {
            font-size: 48px;
            color: #e63946;
            margin-bottom: 16px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: rgba(255,255,255,0.6); margin-bottom: 24px; font-size: 14px; }
        .btn {
            display: inline-block;
            background: #e63946;
            color: #fff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #c1121f; }
        .btn:active { transform: scale(0.97); }
        .steps { text-align: left; margin: 20px 0; font-size: 13px; color: rgba(255,255,255,0.5); }
        .steps li { margin-bottom: 8px; }
        .countdown { font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 16px; }
        .fallback { margin-top: 16px; font-size: 12px; }
        .fallback a { color: #e63946; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#9733;</div>
        <h1>Baixar Pires FM</h1>
        <p>Clique no botao abaixo para baixar o aplicativo Android</p>
        <a id="downloadLink" class="btn" href="PiresFM.apk">Baixar APK</a>
        <div class="countdown" id="countdown"></div>
        <div class="fallback">
            Se nao baixar automaticamente, <a href="PiresFM.apk" download="PiresFM.apk">clique aqui</a>
        </div>
    </div>
    <script>
        var dl = document.getElementById('downloadLink');
        var cd = document.getElementById('countdown');
        var sec = 3;
        function tick() {
            if (sec > 0) {
                cd.textContent = 'Iniciando download em ' + sec + '...';
                sec--;
                setTimeout(tick, 1000);
            } else {
                cd.textContent = 'Download iniciado!';
                window.location.href = dl.href;
            }
        }
        tick();
    </script>
</body>
</html>
