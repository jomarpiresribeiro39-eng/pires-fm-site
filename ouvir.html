        var PLAYLIST = [];

        function loadPlaylist(callback) {
            if (PLAYLIST_LOADED && callback) return callback();
            fetch('playlist.json?' + Date.now()).then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            }).then(function(data) {
                if (data && data.length > 0) {
                    PLAYLIST = data;
                    PLAYLIST_LOADED = true;
                    try { localStorage.setItem('piresfm_playlist_cache', JSON.stringify(data)); } catch(e) {}
                } else {
                    throw new Error('empty');
                }
                if (callback) callback();
            }).catch(function() {
                try {
                    var cached = JSON.parse(localStorage.getItem('piresfm_playlist_cache'));
                    if (cached && cached.length > 0) { PLAYLIST = cached; PLAYLIST_LOADED = true; if (callback) callback(); return; }
                } catch(e) {}
                PLAYLIST = DEFAULT;
                PLAYLIST_LOADED = true;
                if (callback) callback();
            });
        }

        // ========== CLOCK ==========
        function updateClock() {
            var now = new Date();
            var opts = { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
            var parts = new Intl.DateTimeFormat("pt-BR", opts).formatToParts(now);
            var h = parts.find(function(p){return p.type==="hour";}).value;
            var m = parts.find(function(p){return p.type==="minute";}).value;
            var s = parts.find(function(p){return p.type==="second";}).value;
            document.getElementById("clock").textContent = h + ":" + m + ":" + s;
            var dopts = { timeZone: "America/Sao_Paulo", weekday: "long", day: "numeric", month: "long", year: "numeric" };

        // ========== SYNC FORMULA ==========
        function getElapsed() { return (Date.now() - EPOCH) / 1000; }

        function getCurrentTrack() {
            var cycle = AVG + (LOC_DUR / LOC_EACH);
            var songNum = Math.floor(getElapsed() / cycle);
            var idx = songNum % PLAYLIST.length;
            var timeInCycle = getElapsed() % cycle;
            var offset = 0;
            if (timeInCycle < AVG) offset = Math.min(timeInCycle, AVG - 1);
            return { index: idx, offset: offset };
        }

        // ========== UI STATE ==========
        function setUI(state) {
            var playIcon = document.getElementById("playIcon");
            var vinyl = document.getElementById("vinyl");
            var visualizer = document.getElementById("visualizer");
            var st = document.getElementById("streamStatus");
            var np = document.getElementById("nowPlaying");
            if (state === "playing") {
                playIcon.className = "fas fa-pause";
                playIcon.parentElement.classList.add("playing");
                vinyl.classList.add("spinning");
                visualizer.classList.add("active");
                st.innerHTML = '<i class="fas fa-wifi"></i> <span>Tocando ao vivo</span>';
                st.className = "stream-status connected";
                np.classList.remove("announcing");
            } else if (state === "paused") {
                playIcon.className = "fas fa-play";
                playIcon.parentElement.classList.remove("playing");
                vinyl.classList.remove("spinning");
                visualizer.classList.remove("active");
                st.innerHTML = '<i class="fas fa-pause"></i> <span>Pausado</span>';
                st.className = "stream-status";
                np.classList.remove("announcing");
            } else if (state === "loading") {
                st.innerHTML = '<i class="fas fa-cloud"></i> <span>Carregando...</span>';
                st.className = "stream-status";
            } else if (state === "locucao") {
                playIcon.className = "fas fa-pause";
                playIcon.parentElement.classList.add("playing");
                vinyl.classList.remove("spinning");
                visualizer.classList.remove("active");
                st.innerHTML = '<i class="fas fa-microphone"></i> <span>Pires FM - Locucao</span>';
                st.className = "stream-status connected";
                np.classList.add("announcing");
            }
        }

        // ========== LOAD MUSIC TRACK ==========
        function loadTrack(idx, seekTo) {
            if (idx < 0 || idx >= PLAYLIST.length) return;
            loading = true;
            var track = PLAYLIST[idx];
            var url = "https://archive.org/download/" + ARCHIVE_MUSIC + "/" + encodeURIComponent(track.file);

            if (megaMixTimer) { clearTimeout(megaMixTimer); megaMixTimer = null; }

            var newAudio = new Audio();
            newAudio.preload = "auto";
            newAudio.muted = false;
            newAudio.volume = userVolume;

            newAudio.oncanplay = function() {
                newAudio.oncanplay = null;
                newAudio.onerror = null;
                loading = false;
                if (seekTo > 0 && seekTo < newAudio.duration) newAudio.currentTime = seekTo;
            };

            newAudio.onerror = function() {
                newAudio.oncanplay = null;
                newAudio.onerror = null;
                loading = false;
                setTimeout(function() { loading = false; loadTrack(idx, seekTo); }, 3000);
            };

            newAudio.addEventListener("timeupdate", function() {
                if (isAnnouncing || !isPlaying) return;
                var d = newAudio.duration;
                if (d && isFinite(d)) {
                    var rem = d - newAudio.currentTime;
                    if (rem < 1.5) {
                        newAudio.onended = null;
                        goNext();
                    }
                }
            });

            newAudio.src = url;
            newAudio.load();
            audio = newAudio;

            currentTrackIdx = idx;
            isPlaying = true;
            setUI("playing");
            document.getElementById("trackName").textContent = track.song;
            document.getElementById("trackArtist").textContent = track.artist;

            var thisAudio = newAudio;
            function tryPlay() {
                thisAudio.play().then(function() {
                    if (audio !== thisAudio) return;
                    var dur = thisAudio.duration;
                    var timeout = AVG;
                    if (dur && isFinite(dur) && dur < 600) {
                        timeout = Math.ceil(dur) + 10;
                    }
                    megaMixTimer = setTimeout(function() {
                        if (isPlaying && !isAnnouncing && audio === thisAudio) {
                            console.log("[Pires FM] Timeout da faixa, avancando");
                            goNext();
                        }
                    }, timeout * 1000);
                }).catch(function() {
                    loading = false;
                    setTimeout(tryPlay, 500);
                });
            }
            tryPlay();

            loading = false;
        }

        // ========== LOCUCOES ==========
        function playAudioFile(url) {
            return new Promise(function(resolve, reject) {
                var a = new Audio();
                a.preload = "auto";
                a.onended = function() { resolve(); };
                a.onerror = function() { reject(); };
                a.src = url;
                a.load();
                a.play().catch(reject);
            });
        }

        function falarComVoz(texto) {
            return new Promise(function(resolve) {
                if (!("speechSynthesis" in window)) { resolve(); return; }
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(texto);
                u.lang = "pt-BR";
                u.rate = 0.9;
                u.pitch = 1.0;
                u.volume = 1.0;
                var voices = window.speechSynthesis.getVoices();
                var ptBr = voices.find(function(v) { return v.lang === "pt-BR" && v.name.indexOf("Google") === -1; }) || voices.find(function(v) { return v.lang === "pt-BR"; });
                if (ptBr) u.voice = ptBr;
                u.onend = function() { setTimeout(resolve, 300); };
                u.onerror = function() { resolve(); };
                window.speechSynthesis.speak(u);
            });
        }

        function getHorarioRio() {
            var now = new Date();
            var options = { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit", hour12: false };
            var parts = new Intl.DateTimeFormat("pt-BR", options).formatToParts(now);
            var h = parseInt(parts.find(function(p) { return p.type === "hour"; }).value);
            var m = parseInt(parts.find(function(p) { return p.type === "minute"; }).value);
            return { hora: h, minuto: m };
        }

        function falarHorario(hora, minuto) {
            var hPorExtenso = ["zero","uma","duas","tres","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove","vinte","vinte e uma","vinte e duas","vinte e tres"];
            var mPorExtenso = ["zero","um","dois","tres","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove","vinte","vinte e um","vinte e dois","vinte e tres","vinte e quatro","vinte e cinco","vinte e seis","vinte e sete","vinte e oito","vinte e nove","trinta","trinta e um","trinta e dois","trinta e tres","trinta e quatro","trinta e cinco"];
            var texto = "";
            if (hora === 0 && minuto === 0) { texto = "Meia noite e zero minutos"; }
            else if (hora === 12 && minuto === 0) { texto = "Meio dia e zero minutos"; }
            else {
                texto = hPorExtenso[hora] || hora;
                texto += " hora" + (hora !== 1 ? "s" : "");
                if (minuto > 0) {
                    texto += " e " + (mPorExtenso[minuto] || minuto) + " minuto" + (minuto !== 1 ? "s" : "");
                }
            }
            return "Aqui na Pires FM, sao " + texto + "! A voz do Rio de Janeiro!";
        }

        function doLocucao(callback) {
            if (isAnnouncing) { if (callback) callback(); return; }
            isAnnouncing = true;
            savedVolume = audio.volume;
            audio.volume = 0.02;
            setUI("locucao");

            var rand = Math.random();

            if (rand < 0.20) {
                doHoraCerta(callback);
            } else if (rand < 0.40) {
                doClima(callback);
            } else if (rand < 0.55) {
                doIdent(callback);
            } else {
                doPreGravada(callback);
            }
        }

        function doHoraCerta(callback) {
            document.getElementById("trackName").textContent = "Hora Certa";
            document.getElementById("trackArtist").textContent = "Pires FM - A hora certa do Rio!";
            var introFile = horaIntros[Math.floor(Math.random() * horaIntros.length)];
            var outroFile = horaOutros[Math.floor(Math.random() * horaOutros.length)];
            var introUrl = "https://archive.org/download/" + ARCHIVE_LOC + "/" + encodeURIComponent(introFile);
            var outroUrl = "https://archive.org/download/" + ARCHIVE_LOC + "/" + encodeURIComponent(outroFile);
            var horario = getHorarioRio();
            var textoHora = falarHorario(horario.hora, horario.minuto);
            playAudioFile(introUrl)
                .then(function() { return falarComVoz(textoHora); })
                .then(function() { return falarComVoz("Pires FM, a voz do Rio de Janeiro, sempre com voce!"); })
                .then(function() { return playAudioFile(outroUrl); })
                .then(function() { finishLocucao(callback); })
                .catch(function() { finishLocucao(callback); });
        }

        function doClima(callback) {
            document.getElementById("trackName").textContent = "Tempo no Rio";
            document.getElementById("trackArtist").textContent = "Pires FM - Informacoes do tempo...";
            var introFile = horaIntros[Math.floor(Math.random() * horaIntros.length)];
            var outroFile = horaOutros[Math.floor(Math.random() * horaOutros.length)];
            var introUrl = "https://archive.org/download/" + ARCHIVE_LOC + "/" + encodeURIComponent(introFile);
            var outroUrl = "https://archive.org/download/" + ARCHIVE_LOC + "/" + encodeURIComponent(outroFile);
            fetch("https://api.open-meteo.com/v1/forecast?latitude=-22.9068&longitude=-43.1729&current_weather=true&timezone=America/Sao_Paulo")
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var cw = data.current_weather;
                    var condicoes = {0:"ceu limpo",1:"ceu quase limpo",2:"parcialmente nublado",3:"nublado",45:"neblina",51:"garoa leve",53:"garoa moderada",55:"garoa forte",61:"chuva leve",63:"chuva moderada",65:"chuva forte",80:"pancadas leves",81:"pancadas moderadas",82:"pancadas fortes",95:"tempestade"};
                    var cond = condicoes[cw.weathercode] || "condicoes variaveis";
                    var texto = "No Rio de Janeiro agora sao " + cw.temperature + " graus, " + cond + ", com vento de " + cw.windspeed + " quilometros por hora. Fique ligado na Pires FM, a voz do Rio de Janeiro!";
                    return playAudioFile(introUrl)
                        .then(function() { return falarComVoz(texto); })
                        .then(function() { return playAudioFile(outroUrl); });
                })
                .then(function() { finishLocucao(callback); })
                .catch(function() { finishLocucao(callback); });
        }

        function doIdent(callback) {
            var frases = [
                "Voce esta ouvindo Pires FM, a voz do Rio de Janeiro! A melhor musica sempre com voce!",
                "Pires FM, a radio que toca o coracao do Rio! Fique sintonizado!",
                "Aqui e Pires FM, a melhor musica do Rio de Janeiro! Sempre com voce!",
                "Voce esta sintonizado na Pires FM, a radio do carioca! A melhor da cidade!"
            ];
            var texto = frases[Math.floor(Math.random() * frases.length)];
            var outroFile = horaOutros[Math.floor(Math.random() * horaOutros.length)];
            var outroUrl = "https://archive.org/download/" + ARCHIVE_LOC + "/" + encodeURIComponent(outroFile);
            document.getElementById("trackName").textContent = "Identificacao";
            document.getElementById("trackArtist").textContent = "Pires FM - A voz do Rio!";
            falarComVoz(texto)
                .then(function() { return playAudioFile(outroUrl); })
                .then(function() { finishLocucao(callback); })
                .catch(function() { finishLocucao(callback); });
        }

        function doPreGravada(callback) {
            var tipos = Object.keys(locucoesArquivos);
            var tipo;
            do { tipo = tipos[Math.floor(Math.random() * tipos.length)]; } while (tipo === lastLocucaoType && tipos.length > 1);
            lastLocucaoType = tipo;
            var arquivos = locucoesArquivos[tipo];
            var arquivo = arquivos[Math.floor(Math.random() * arquivos.length)];
            var url = "https://archive.org/download/" + ARCHIVE_LOC + "/" + encodeURIComponent(arquivo);
            var nomes = { ident: "Identificacao Pires FM", curiosidade: "Curiosidade do Rio", noticia: "Noticia do Rio", dica: "Dica do Dia", programacao: "Programacao" };
            document.getElementById("trackName").textContent = nomes[tipo] || "Locucao";
            document.getElementById("trackArtist").textContent = "Pires FM - Locucao profissional...";

            var outroFile = horaOutros[Math.floor(Math.random() * horaOutros.length)];
            var outroUrl = "https://archive.org/download/" + ARCHIVE_LOC + "/" + encodeURIComponent(outroFile);

            playAudioFile(url)
                .then(function() { return falarComVoz("Pires FM, a voz do Rio de Janeiro!"); })
                .then(function() { return playAudioFile(outroUrl); })
                .then(function() { finishLocucao(callback); })
                .catch(function() { finishLocucao(callback); });
        }

        function finishLocucao(callback) {
            isAnnouncing = false;
            audio.volume = userVolume;
            document.getElementById("nowPlaying").classList.remove("announcing");
            setTimeout(function() {
                if (callback) callback();
            }, 300);
        }

        // ========== NEXT TRACK ==========
        function goNext() {
            if (megaMixTimer) { clearTimeout(megaMixTimer); megaMixTimer = null; }
            if (isAnnouncing) return;
            var nextIdx = (currentTrackIdx + 1) % PLAYLIST.length;
            songsPlayed++;
            if (songsPlayed >= LOC_EACH) {
                songsPlayed = 0;
                doLocucao(function() {
                    loadTrack(nextIdx, 0);
                });
            } else {
                loadTrack(nextIdx, 0);
            }
        }

        // ========== SYNC (ONLY AFTER START) ==========
        function syncToLive() {
            if (!hasStarted || isAnnouncing || loading) return;
            var now = getCurrentTrack();
            if (now.index !== currentTrackIdx) {
                loadTrack(now.index, now.offset);
            } else if (audio.duration && audio.currentTime < now.offset - 30) {
                audio.currentTime = now.offset;
            }
        }

        // ========== START RADIO ==========
        loadPlaylist(function() {
            document.getElementById("autoplayBtn").addEventListener("click", function() {
                document.getElementById("autoplayOverlay").classList.add("hidden");
                hasStarted = true;
                songsPlayed = 0;
                audio.muted = false;
                var now = getCurrentTrack();
                loadTrack(now.index, now.offset);
                setInterval(syncToLive, 10000);
            });
        });

        // ========== PLAY/PAUSE ==========
        document.getElementById("playBtn").addEventListener("click", function() {
            if (isAnnouncing) return;
            if (isPlaying) {
                audio.muted = true;
                isPlaying = false;
                setUI("paused");
            } else {
                audio.muted = false;
                isPlaying = true;
                hasStarted = true;
                var now = getCurrentTrack();
                if (now.index !== currentTrackIdx) {
                    loadTrack(now.index, now.offset);
                } else {
                    audio.play().then(function() { setUI("playing"); }).catch(function() {});
                }
            }
        });

        // ========== VOLUME ==========
        var volumeSlider = document.getElementById("volumeSlider");
        var volumeValue = document.getElementById("volumeValue");
        var volumeIcon = document.getElementById("volumeIcon");

        volumeSlider.addEventListener("input", function(e) {
            var v = parseInt(e.target.value);
            userVolume = v / 100;
            if (!isAnnouncing) audio.volume = userVolume;
            volumeValue.textContent = v + "%";
            volumeIcon.className = v === 0 ? "fas fa-volume-mute" : v < 50 ? "fas fa-volume-down" : "fas fa-volume-up";
        });

        volumeIcon.addEventListener("click", function() {
            if (audio.volume > 0) {
                audio.dataset.pv = volumeSlider.value;
                userVolume = 0;
                audio.volume = 0;
                volumeSlider.value = 0;
                volumeValue.textContent = "0%";
                volumeIcon.className = "fas fa-volume-mute";
            } else {
                var p = audio.dataset.pv || 80;
                userVolume = p / 100;
                audio.volume = userVolume;
                volumeSlider.value = p;
                volumeValue.textContent = p + "%";
                volumeIcon.className = p < 50 ? "fas fa-volume-down" : "fas fa-volume-up";
            }
        });

        audio.volume = 0.8;

        // ========== STREAM MODE (Caster.fm) ==========
        var streamMode = false;
        var streamUrl = '';
        (function() {
            try {
                var data = JSON.parse(localStorage.getItem('piresfm_admin')) || {};
                var cfg = data.config || {};
                if (cfg.streamUrl) {
                    streamUrl = cfg.streamUrl + (cfg.streamMount || '/piresfm');
                    document.getElementById('streamToggle').style.display = 'flex';
                    document.getElementById('streamModeLabel').textContent = 'Modo: Arquivos';
                }
            } catch(e) {}
        })();

        window.toggleStreamMode = function() {
            streamMode = !streamMode;
            var btn = document.getElementById('streamModeBtn');
            var label = document.getElementById('streamModeLabel');
            if (streamMode) {
                btn.innerHTML = '<i class="fas fa-file-audio"></i> Mudar para Arquivos';
                label.textContent = 'Modo: Stream 24/7';
                label.style.color = '#4caf50';
                if (streamUrl && !audio.paused) {
                    audio.src = streamUrl;
                    audio.play();
                }
            } else {
                btn.innerHTML = '<i class="fas fa-broadcast-tower"></i> Mudar para Stream';
                label.textContent = 'Modo: Arquivos';
                label.style.color = '';
                if (isPlaying) {
                    var now = getCurrentTrack();
                    loadTrack(now.index, now.offset);
                }
            }
        };

        // ========== VISUALIZER ==========
        (function animVis() {
            if (isPlaying && !isAnnouncing) {
                var bars = document.querySelectorAll(".visualizer .bar");
                for (var i = 0; i < bars.length; i++) bars[i].style.height = (Math.random() * 50 + 5) + "px";
            }
            requestAnimationFrame(function() { setTimeout(animVis, 120); });
        })();

    })();
    </script>
    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js").then(function(reg) {
            console.log("Pires FM: Service Worker registrado", reg.scope);
        }).catch(function(err) {
            console.log("Pires FM: Erro no SW:", err);
        });
    }
    </script>
</body>
</html>
