<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pires FM - Ouça Ao Vivo</title>
    <meta name="theme-color" content="#e63946">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pires FM">
    <meta name="description" content="Pires FM - Radio ao vivo 24h. A voz do Rio de Janeiro.">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div id="bgSlideshow" class="bg-slideshow"></div>
    <div class="bg-overlay"></div>

    <audio id="radioAudio" preload="auto"></audio>

    <div id="autoplayOverlay" class="autoplay-overlay">
        <div class="autoplay-content">
            <div class="autoplay-logo">
                <div class="autoplay-icon"><i class="fas fa-broadcast-tower"></i></div>
                <h1>Pires <span>FM</span></h1>
                <p>A voz do Rio de Janeiro</p>
            </div>
            <button id="autoplayBtn" class="autoplay-btn">
                <i class="fas fa-play"></i>
            </button>
            <p class="autoplay-text">Clique para ouvir</p>
        </div>
    </div>

    <section class="hero" id="player">
        <div class="hero-bg"></div>
        <div class="particles" id="particles"></div>
        <div class="container hero-content">

            <div class="on-air-badge">
                <span class="pulse-dot"></span>
                <span>AO VIVO</span>
            </div>

            <div class="clock-section">
                <div class="clock-label">
                    <i class="fas fa-map-marker-alt"></i> Horario no Rio de Janeiro
                </div>
                <div class="clock" id="clock">00:00:00</div>
                <div class="clock-date" id="clockDate">Carregando...</div>
            </div>

            <div class="now-playing" id="nowPlaying">
                <div class="voice-overlay" id="voiceOverlay">
                    <div class="voice-pulse"></div>
                    <i class="fas fa-microphone"></i>
                    <span>Locucao</span>
                </div>
                <div class="vinyl" id="vinyl">
                    <div class="vinyl-inner">
                        <i class="fas fa-music"></i>
                    </div>
                </div>
                <div class="track-info">
                    <p class="track-label">Tocando Agora</p>
                    <h2 class="track-name" id="trackName">Aguardandoconexao...</h2>
                    <p class="track-artist" id="trackArtist">Pires FM</p>
                </div>
            </div>

            <div class="visualizer" id="visualizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div>
            </div>

            <div class="player-controls">
                <div class="main-controls">
                    <button class="play-btn" id="playBtn">
                        <i class="fas fa-play" id="playIcon"></i>
                    </button>
                </div>
                <div class="volume-control">
                    <i class="fas fa-volume-up" id="volumeIcon"></i>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
                    <span class="volume-value" id="volumeValue">80%</span>
                </div>
            </div>

            <div class="stream-status" id="streamStatus">
                <i class="fas fa-wifi"></i>
                <span>Clique no play para ouvir</span>
            </div>

            <div class="social-links">
                <a href="#" class="social-link" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-link" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-link" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                <a href="#" class="social-link" title="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="#" class="social-link" title="Twitter"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </section>

    <script>
    (function() {
        var PLAYLIST = [
            { file: "001.mp3", artist: "Foreigner (cover)", song: "I Want To Know What Love Is" },
            { file: "002.mp3", artist: "Sophie Ellis-Bextor", song: "Murder On The Dancefloor" },
            { file: "003.mp3", artist: "4 Non Blondes", song: "What's Up" },
            { file: "004.mp3", artist: "Ace of Base", song: "Beautiful Life" },
            { file: "005.mp3", artist: "Adriana Calcanhotto", song: "Devolva-Me" },
            { file: "006.mp3", artist: "Alicia Keys & Jay-Z", song: "Empire State of Mind" },
            { file: "007.mp3", artist: "Amy Macdonald", song: "This Is The Life" },
            { file: "008.mp3", artist: "Amy Winehouse", song: "Back To Black" },
            { file: "009.mp3", artist: "Billy Idol", song: "Eyes Without a Face" },
            { file: "010.mp3", artist: "Billy Preston", song: "My Sweet Lord" },
            { file: "011.mp3", artist: "Boney M.", song: "Rasputin" },
            { file: "012.mp3", artist: "Breakaway", song: "Versao Original" },
            { file: "013.mp3", artist: "Caro Emerald", song: "A Night Like This" },
            { file: "014.mp3", artist: "Mauricio Manieri", song: "Classics" },
            { file: "015.mp3", artist: "Daniel", song: "Seus Beijos" },
            { file: "016.mp3", artist: "Desireless", song: "Voyage Voyage" },
            { file: "017.mp3", artist: "Dido", song: "White Flag" },
            { file: "018.mp3", artist: "Dire Straits", song: "Sultans Of Swing" },
            { file: "019.mp3", artist: "Elton John", song: "Sacrifice" },
            { file: "020.mp3", artist: "Enigma", song: "Sadeness" },
            { file: "021.mp3", artist: "Era", song: "Ameno" },
            { file: "022.mp3", artist: "Erasure", song: "Love To Hate You" },
            { file: "023.mp3", artist: "Erasure", song: "A Little Respect" },
            { file: "024.mp3", artist: "Eurythmics", song: "I Saved The World Today" },
            { file: "025.mp3", artist: "Eurythmics", song: "The Miracle Of Love" },
            { file: "026.mp3", artist: "Eurythmics", song: "There Must Be An Angel" },
            { file: "027.mp3", artist: "Eurythmics", song: "Why" },
            { file: "028.mp3", artist: "George Michael", song: "Careless Whisper" },
            { file: "029.mp3", artist: "Guto Loureiro", song: "Flashback 80/90/2000" },
            { file: "030.mp3", artist: "Guto Loureiro", song: "Eurodance 90" },
            { file: "031.mp3", artist: "Rod Stewart", song: "I Don't Want To Talk About It" },
            { file: "032.mp3", artist: "Mauricio Manieri", song: "In Your Eyes" },
            { file: "033.mp3", artist: "Lighthouse Family", song: "High" },
            { file: "034.mp3", artist: "Marisa Monte", song: "Pra Melhorar" },
            { file: "035.mp3", artist: "Marisa Monte", song: "Ainda Bem" },
            { file: "036.mp3", artist: "Marisa Monte", song: "Depois" },
            { file: "037.mp3", artist: "Marisa Monte", song: "Nao E Facil" },
            { file: "038.mp3", artist: "Marisa Monte", song: "Nao Va Embora" },
            { file: "039.mp3", artist: "Mauricio Manieri", song: "Bem Querer" },
            { file: "040.mp3", artist: "Mauricio Manieri", song: "Primavera" },
            { file: "041.mp3", artist: "Mauricio Manieri", song: "Se Quer Saber" },
            { file: "042.mp3", artist: "Mauricio Manieri", song: "Sua Cancao" },
            { file: "043.mp3", artist: "Nathan Evans", song: "Wellerman" },
            { file: "044.mp3", artist: "Nenhum de Nos", song: "Camila" },
            { file: "045.mp3", artist: "Opus & Gazebo", song: "I Like Chopin" },
            { file: "046.mp3", artist: "Paula Toller", song: "Amorosa" },
            { file: "047.mp3", artist: "Pet Shop Boys", song: "It's A Sin" },
            { file: "048.mp3", artist: "Pet Shop Boys", song: "West End Girls" },
            { file: "049.mp3", artist: "Peter Cetera", song: "Hard to Say I'm Sorry" },
            { file: "050.mp3", artist: "Nando Reis", song: "Por Onde Andei" },
            { file: "051.mp3", artist: "Ana Canas & Nando Reis", song: "Pra Voce Guardei o Amor" },
            { file: "052.mp3", artist: "R.E.M.", song: "Losing My Religion" },
            { file: "053.mp3", artist: "Rachid Taha", song: "Ya Rayah" },
            { file: "054.mp3", artist: "Rionegro & Solimoes", song: "A Gente Se Entrega" },
            { file: "055.mp3", artist: "Skank", song: "Tanto (I Want You)" },
            { file: "056.mp3", artist: "Mauricio Manieri", song: "Te Quero Tanto" },
            { file: "057.mp3", artist: "Telemensagem", song: "Boa Noite" },
            { file: "058.mp3", artist: "Vanessa da Mata", song: "Ainda Bem" },
            { file: "059.mp3", artist: "Vanessa da Mata", song: "Amado" },
            { file: "060.mp3", artist: "Vanessa da Mata", song: "Boa Sorte / Good Luck" },
            { file: "061.mp3", artist: "Vanessa da Mata", song: "Gente Feliz" },
            { file: "062.mp3", artist: "Vanessa da Mata", song: "So Voce e Eu" },
            { file: "063.mp3", artist: "Elton John", song: "Your Song" },
            { file: "064.mp3", artist: "Zeca Baleiro", song: "Price Tag" },
            { file: "065.mp3", artist: "Zeze Di Camargo & Luciano", song: "Pra Mudar a Minha Vida" },
            { file: "066.mp3", artist: "Telemensagem", song: "Boa Noite (Voz)" }
        ];

        var ARCHIVE = "pires-fm-musicas";
        var EPOCH = new Date("2025-01-01T00:00:00-03:00").getTime();
        var AVG = 240;
        var LOC_DUR = 12;
        var audio = document.getElementById("radioAudio");
        var isPlaying = false;
        var currentTrackIdx = -1;
        var loading = false;

        var bgImgs = ["img/cristo.jpg", "img/pao_de_acucar.jpg", "img/ipanema.jpg"];
        var bgIdx = 0;
        document.getElementById("bgSlideshow").style.backgroundImage = "url(" + bgImgs[0] + ")";
        setInterval(function() {
            var el = document.getElementById("bgSlideshow");
            el.style.opacity = "0";
            setTimeout(function() {
                bgIdx = (bgIdx + 1) % bgImgs.length;
                el.style.backgroundImage = "url(" + bgImgs[bgIdx] + ")";
                el.style.opacity = "1";
            }, 1500);
        }, 8000);

        function createParticles() {
            var c = document.getElementById("particles");
            if (!c) return;
            for (var i = 0; i < 30; i++) {
                var p = document.createElement("div");
                p.className = "particle";
                p.style.left = Math.random() * 100 + "%";
                p.style.animationDuration = (Math.random() * 15 + 10) + "s";
                p.style.animationDelay = (Math.random() * 15) + "s";
                p.style.width = p.style.height = (Math.random() * 3 + 1) + "px";
                c.appendChild(p);
            }
        }
        createParticles();

        function updateClock() {
            var now = new Date();
            var opts = { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
            var parts = new Intl.DateTimeFormat("pt-BR", opts).formatToParts(now);
            var h = parts.find(function(p){return p.type==="hour";}).value;
            var m = parts.find(function(p){return p.type==="minute";}).value;
            var s = parts.find(function(p){return p.type==="second";}).value;
            document.getElementById("clock").textContent = h + ":" + m + ":" + s;
            var dopts = { timeZone: "America/Sao_Paulo", weekday: "long", day: "numeric", month: "long", year: "numeric" };
            document.getElementById("clockDate").textContent = new Intl.DateTimeFormat("pt-BR", dopts).format(now);
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getElapsed() { return (Date.now() - EPOCH) / 1000; }

        function getCurrentTrack() {
            var cycle = AVG + (LOC_DUR / 3);
            var songNum = Math.floor(getElapsed() / cycle);
            var idx = songNum % PLAYLIST.length;
            var timeInCycle = getElapsed() % cycle;
            var offset = 0;
            if (timeInCycle < AVG) offset = Math.min(timeInCycle, AVG - 1);
            return { index: idx, offset: offset };
        }

        function loadTrack(idx, seekTo) {
            if (loading) return;
            loading = true;
            var track = PLAYLIST[idx];
            var url = "https://archive.org/download/" + ARCHIVE + "/" + encodeURIComponent(track.file);

            audio.oncanplay = null;
            audio.onerror = null;
            audio.src = url;

            audio.oncanplay = function() {
                audio.oncanplay = null;
                audio.onerror = null;
                loading = false;
                if (seekTo > 0 && seekTo < audio.duration) audio.currentTime = seekTo;
                audio.play().then(function() {
                    document.getElementById("trackName").textContent = track.song;
                    document.getElementById("trackArtist").textContent = track.artist;
                    document.getElementById("vinyl").classList.add("spinning");
                    document.getElementById("visualizer").classList.add("active");
                    document.getElementById("playIcon").className = "fas fa-pause";
                    document.getElementById("playIcon").parentElement.classList.add("playing");
                    isPlaying = true;
                    currentTrackIdx = idx;
                    var st = document.getElementById("streamStatus");
                    st.innerHTML = '<i class="fas fa-wifi"></i> <span>Tocando ao vivo</span>';
                    st.className = "stream-status connected";
                }).catch(function() { loading = false; });
            };

            audio.onerror = function() {
                audio.oncanplay = null;
                audio.onerror = null;
                loading = false;
                setTimeout(function() { loadTrack(idx, seekTo); }, 3000);
            };

            var st = document.getElementById("streamStatus");
            st.innerHTML = '<i class="fas fa-cloud"></i> <span>Carregando...</span>';
            st.className = "stream-status";
        }

        function syncToLive() {
            var now = getCurrentTrack();
            if (now.index !== currentTrackIdx) {
                loadTrack(now.index, now.offset);
            } else if (audio.duration && Math.abs(audio.currentTime - now.offset) > 5) {
                audio.currentTime = now.offset;
            }
        }

        setInterval(syncToLive, 10000);

        audio.addEventListener("ended", function() {
            var now = getCurrentTrack();
            loadTrack(now.index, now.offset);
        });

        document.getElementById("autoplayBtn").addEventListener("click", function() {
            var overlay = document.getElementById("autoplayOverlay");
            overlay.classList.add("hidden");
            audio.muted = false;
            var now = getCurrentTrack();
            loadTrack(now.index, now.offset);
            document.getElementById("vinyl").classList.add("spinning");
            document.getElementById("visualizer").classList.add("active");
            document.getElementById("playIcon").className = "fas fa-pause";
            document.getElementById("playIcon").parentElement.classList.add("playing");
            isPlaying = true;
            var st = document.getElementById("streamStatus");
            st.innerHTML = '<i class="fas fa-wifi"></i> <span>Tocando ao vivo</span>';
            st.className = "stream-status connected";
        });

        document.getElementById("playBtn").addEventListener("click", function() {
            if (isPlaying) {
                audio.muted = true;
                isPlaying = false;
                document.getElementById("playIcon").className = "fas fa-play";
                document.getElementById("playIcon").parentElement.classList.remove("playing");
                document.getElementById("vinyl").classList.remove("spinning");
                document.getElementById("visualizer").classList.remove("active");
                var st = document.getElementById("streamStatus");
                st.innerHTML = '<i class="fas fa-pause"></i> <span>Pausado</span>';
                st.className = "stream-status";
            } else {
                audio.muted = false;
                isPlaying = true;
                document.getElementById("playIcon").className = "fas fa-pause";
                document.getElementById("playIcon").parentElement.classList.add("playing");
                document.getElementById("vinyl").classList.add("spinning");
                document.getElementById("visualizer").classList.add("active");
                syncToLive();
                var st2 = document.getElementById("streamStatus");
                st2.innerHTML = '<i class="fas fa-wifi"></i> <span>Tocando ao vivo</span>';
                st2.className = "stream-status connected";
            }
        });

        var volumeSlider = document.getElementById("volumeSlider");
        var volumeValue = document.getElementById("volumeValue");
        var volumeIcon = document.getElementById("volumeIcon");

        volumeSlider.addEventListener("input", function(e) {
            var v = parseInt(e.target.value);
            audio.volume = v / 100;
            volumeValue.textContent = v + "%";
            volumeIcon.className = v === 0 ? "fas fa-volume-mute" : v < 50 ? "fas fa-volume-down" : "fas fa-volume-up";
        });

        volumeIcon.addEventListener("click", function() {
            if (audio.volume > 0) {
                audio.dataset.pv = volumeSlider.value;
                audio.volume = 0;
                volumeSlider.value = 0;
                volumeValue.textContent = "0%";
                volumeIcon.className = "fas fa-volume-mute";
            } else {
                var p = audio.dataset.pv || 80;
                audio.volume = p / 100;
                volumeSlider.value = p;
                volumeValue.textContent = p + "%";
                volumeIcon.className = p < 50 ? "fas fa-volume-down" : "fas fa-volume-up";
            }
        });

        audio.volume = 0.8;

        (function animVis() {
            if (isPlaying) {
                var bars = document.querySelectorAll(".visualizer .bar");
                for (var i = 0; i < bars.length; i++) bars[i].style.height = (Math.random() * 50 + 5) + "px";
            }
            requestAnimationFrame(function() { setTimeout(animVis, 120); });
        })();

    })();
    </script>
    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js").then(function(reg) {
            console.log("Pires FM: Service Worker registrado", reg.scope);
        }).catch(function(err) {
            console.log("Pires FM: Erro no SW:", err);
        });
    }
    </script>
</body>
</html>
